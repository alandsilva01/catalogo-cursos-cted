<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="icon" href="/assets/img/logo-sesi.svg" type="image/svg+xml">

</head>

  <footer id="rodape"></footer>

  <script type="module" src="/js/layout.js"></script>
