# Sobe a aplicacao com PostgreSQL local: docker compose up --build
# Acesse http://localhost:8080
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: catalogo
      POSTGRES_USER: catalogo
      POSTGRES_PASSWORD: catalogo_local
    volumes:
      - dados-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalogo -d catalogo"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      Database__Provider: Postgres
      ConnectionStrings__Postgres: "Host=db;Port=5432;Database=catalogo;Username=catalogo;Password=catalogo_local"
    ports:
      - "8080:8080"

volumes:
  dados-postgres:
